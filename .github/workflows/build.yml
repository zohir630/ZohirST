name: Unzip and Build ShizuStore APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -q -o 1fec46a9-ShizuStore-master.zip -d project || unzip -q -o ShizuStore-master.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: project/ShizuStore-master

      - name: Build debug APK
        working-directory: project/ShizuStore-master
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizuStore-debug-apk
          path: project/ShizuStore-master/app/build/outputs/apk/debug/*.apk
